name: Ny analysekonklusion
description: Del fundene fra din analyse uden git. Vedligeholderen lægger din fil i analyser/.
title: "Konklusion: <vejnavn>, <by> (<år>)"
labels: ["konklusion"]
body:
  - type: markdown
    attributes:
      value: |
        Lav konklusionsfilen med valg 6 i din analyses `koer_analyse.bat` (eller `program/lav_konklusion.py`), udfyld alle UDFYLD, og tjek den med valg 5. Indsæt så hele filen nedenfor. Felterne er beskrevet i [analyser/README.md](https://github.com/Sydtrafik/Bus_gps_trackpoint_analyse/blob/main/analyser/README.md).
        Kun aggregerede tal: ingen rådata, tur-id'er, mailadresser eller telefonnumre. Issuet er offentligt.
  - type: textarea
    id: fil
    attributes:
      label: Konklusionsfilen (YAML)
      description: Hele indholdet af din udfyldte konklusion.yaml. Har du ikke kunnet lave filen, så udfyld skabelonen så godt du kan; tal uden enhed.
      value: |
        skema: 1
        type: foer_efter          # foer_efter, en_periode eller kryds
        vej:
        by:
        aar:
        vejtype:                  # fx almindelig vej
        omraade:                  # fx boligområde
        buslommer:                # ja, nej eller ukendt
        parkering_paa_vejen:      # ja, nej eller ukendt
        linjer:
        bustype:
        aendring:
        fartdaempere:
          - {type: , antal: }     # fx modificeret cirkelbump, indsnævring; bekraeftet: false, hvis ikke opmålt
        hastighed_kmt: {foer: , efter: }
        laengde_m:
        kort:
        dage: hverdage
        perioder:
          foer: {fra: , til: , dage: }
          efter: {fra: , til: , dage: }
        ture: {foer: , efter: }
        koeretid_s: {foer: , efter: }      # median, uden standsning ved stop
        gnsfart_kmt: {foer: , efter: }
        laveste_fart_kmt: {foer: , efter: }
        maerkbar_opbremsning_pct: {foer: , efter: }
        maerkbar_acceleration_pct: {foer: , efter: }
        forbehold:
          -
        sammenligning_vejregler:
        vaerktoej:
        opdateret:
        kontakt:                  # GitHub-brugernavn
      render: yaml
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: Filen indeholder kun aggregerede tal, ingen rådata, tur-id'er, mail eller telefonnumre.
          required: true
