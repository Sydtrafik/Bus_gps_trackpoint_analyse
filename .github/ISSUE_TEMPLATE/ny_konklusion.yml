name: Ny analysekonklusion
description: Del fundene fra din analyse uden git. Vedligeholderen sætter blokken ind i nationale_analysekonklusioner.md.
title: "Konklusion: <vejnavn>, <by> (<år>)"
labels: ["konklusion"]
body:
  - type: markdown
    attributes:
      value: |
        Udfyld skabelonen nedenfor. Felterne er de samme som i skabelonen nederst i nationale_analysekonklusioner.md.
        Kun aggregerede tal: ingen rådata, tur-id'er, mailadresser eller telefonnumre. Issuet er offentligt.
  - type: textarea
    id: blok
    attributes:
      label: Udfyldt skabelon
      description: Skriv i højre kolonne. Lad en række stå med "ikke oplyst", hvis du ikke kender svaret.
      value: |
        ### <Vejnavn>, <by> (<år>)

        | Felt | Værdi |
        |---|---|
        | Opdateret | <ÅÅÅÅ-MM-DD> |
        | Vejnavn og strækning | <vej>, <længde> m fra <punkt> til <punkt> |
        | By | |
        | Kort | <link til strækningen i Google Maps> |
        | Vejtype | |
        | Linje(r) | <linje, retninger, ture pr. hverdag> |
        | Bustype | <drivmiddel og længde; samme før og efter?> |
        | Ændring | <hvad blev ændret, og hvornår> |
        | Type bump | <fx sinusbump, cirkelbump, trapezbump; "ikke bekræftet", hvis antaget> |
        | Sammenligning med vejregler | |
        | Antal bump og placering | |
        | Indsnævring | |
        | Sving | |
        | Hastighedsbegrænsning | <før / efter> |
        | Stoppesteder på strækningen | |
        | Perioder for data | <før og efter: datoer, hverdage, ture> |
        | Udeladte dage | |
        | Analyse på trackpoint eller stoppoint | |
        | Data med og uden standsning ved stop | |
        | Fund: køretid | |
        | Fund: fart | |
        | Fund: komfort (opbremsning og acceleration langs vejen) | |
        | Fund: ekstra tid pr. element | |
        | Fund: drift | |
        | Forbehold | |
        | Rapport | |
        | Værktøjsversion | |
        | Kontaktperson | <GitHub-brugernavn; navn og organisation er valgfrie> |
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: Blokken indeholder kun aggregerede tal, ingen rådata, tur-id'er, mail eller telefonnumre.
          required: true
