<text x="14.0" y="20.0" font-size="15" text-anchor="start" fill="#222222" font-weight="600">Pukkelbump (tværsnit af én kuppel)</text>
<text x="14.0" y="37.0" font-size="11" text-anchor="start" fill="#222222" font-weight="normal">Katalog 2002 og 2013, bilag 5-1 · ønsket hastighed 50 km/t · Ø 1,10 m · 60 mm · dæmper biler, ikke busser</text>
<text x="14.0" y="54.0" font-size="9" text-anchor="start" fill="#555555" font-weight="normal">Samme format som Vejdirektoratets bilag: bumpet er så kort, at tegningen er i næsten rigtige proportioner</text>
<text x="14.0" y="70.0" font-size="9" text-anchor="start" fill="#555555" font-weight="normal">Typen står ikke i BEK 228/2026 eller håndbogsbilaget fra 2026; kataloget fra 2002 er afløst. Se kilder/README.md om reglerne i dag.</text>
